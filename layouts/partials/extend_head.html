<script>

    startOnLoad: true,
    theme: 'dark',
    themeVariables: {
      darkMode: true,
      primaryColor: '#000000',
      primaryTextColor: '#E1E1E1',
      primaryBorderColor: '#BB86FC',
      lineColor: '#03DAC6',
      secondaryColor: '#000000',
      tertiaryColor: '#000000',
      background: '#000000',
      mainBkg: '#000000',
      secondBkg: '#000000',
      tertiaryBkg: '#000000',
      textColor: '#E1E1E1',
      border1: '#BB86FC',
      border2: '#03DAC6',
      nodeBorder: '#BB86FC',
      clusterBkg: '#000000',
      clusterBorder: '#BB86FC',
      arrowheadColor: '#03DAC6',
      edgeLabelBackground: '#000000',
      labelBackground: '#000000',
      labelTextColor: '#E1E1E1',
      fontFamily: 'ui-monospace, monospace'
    }
  });
</script>
