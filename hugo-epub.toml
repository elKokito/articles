
languageCode = 'en-us'
title = 'elkokito - EPUB'
theme = 'PaperMod'

# Output to a different directory for EPUB-friendly build
publishDir = 'public-epub'

# EPUB version will be at /epub/ subdirectory
baseURL = 'https://elkokito.github.io/articles/epub/'

# Pagination settings
[pagination]
  pagerSize = 50  # Show 50 articles per page (default is 10)

# Enable Mermaid diagrams (SVG works in EPUB)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "monokai"

[params]
  description = "much wow"
  author = "elkokito"

  # EPUB-friendly settings
  epubMode = true  # Custom param to detect EPUB build
  
  # Disable interactive features
  defaultTheme = "light"
  disableThemeToggle = true
  ShowCodeCopyButtons = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  ShowFullTextinRSS = true

  # List view settings
  ShowSummary = false

  # Disable custom CSS and JS for EPUB
  [params.assets]
    disableHLJS = false
    # No customCSS for EPUB build

# Menu
[[menu.main]]
  name = "Golang"
  url = "/golang/"
  weight = 1

[[menu.main]]
  name = "Flutter"
  url = "/flutter/"
  weight = 2

[[menu.main]]
  name = "Bubble Tea"
  url = "/bubbletea/"
  weight = 3

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Privacy
[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

