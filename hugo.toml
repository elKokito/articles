
languageCode = 'en-us'
title = 'elkokito'
theme = 'PaperMod'

# Pagination settings
[pagination]
  pagerSize = 50  # Show 50 articles per page (default is 10)

# Enable Mermaid diagrams
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "monokai"

[params]
  description = "much wow"
  author = "elkokito"
  
  # Theme settings
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowCodeCopyButtons = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  
  # List view settings
  ShowSummary = false  # Don't show article previews, just titles
  
  # Enable search
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]
  
  # Home page settings - show recent posts with search
  homeInfoParams = false  # Disable the info banner
  
  # Enable search on home page
  [params.profileMode]
    enabled = false
  
  # Show recent posts on home page
  mainSections = ["golang", "flutter", "bubbletea"]

  # Custom assets
  [params.assets]
    disableHLJS = false
    customCSS = ["css/extended/custom.css"]

# Menu
[[menu.main]]
  name = "Golang"
  url = "/golang/"
  weight = 1

[[menu.main]]
  name = "Flutter"
  url = "/flutter/"
  weight = 2

[[menu.main]]
  name = "Bubble Tea"
  url = "/bubbletea/"
  weight = 3

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Privacy
[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true
